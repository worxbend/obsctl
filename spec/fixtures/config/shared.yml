version: 1
server:
  socket_path: null
  pid_file: /tmp/obsctl.pid
  allow_remote_shutdown: true
  start_embedded_if_missing: false
connection:
  host: localhost
  port: 4456
  password_env: ""
  password: null
  connect_timeout_ms: 1234
  request_timeout_ms: 4321
reconnect:
  enabled: false
  endless: false
  initial_delay_ms: 100
  max_delay_ms: 2000
  multiplier: 2.0
  jitter_ms: 0
ui:
  refresh_interval_ms: 500
  command_palette_prefix: ":"
  mouse: false
  advanced_ui: false
  show_icons: false
  theme: custom
  custom_theme:
    bg: "#101010"
    accent: "#abcdef"
  locale: uk
scenes:
  - name: Main Camera
    alias: main
    shortcut: "1"
    group: live
    stale: false
    hidden: true
  - name: Utility
    stale: true
scene_profiles:
  - name: Streaming
    hidden: [Utility]
active_scene_profile: streaming
audio:
  inputs:
    - name: Mic/Aux
      alias: mic
      shortcut: m
      kind: wasapi_input_capture
      stale: true
keymap:
  quit: [Q, ctrl+c]
  command_palette: [":"]
  reload_config: [R]
  dump_config: [d]
