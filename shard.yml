name: obsctl-cr
version: 0.9.0

authors:
  - obsctl-cr contributors

targets:
  obsctl:
    main: src/obsctl.cr

crystal: ">= 1.21.0"

license: MIT

dependencies:
  # CryTUI is developed in this repository, under crytui/, as its own shard
  # rather than as a directory of obsctl. A path dependency keeps the two
  # buildable together while the boundary between them stays a real one: the
  # library depends on nothing here, and obsctl reaches it only through
  # `require "crytui"`. Kiwi arrives through it, which is why obsctl no longer
  # names Kiwi itself.
  crytui:
    path: ./crytui

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    # Pinned to a master commit: 1.6.4 is the newest release and it does not
    # build on Crystal 1.21 (it calls Crystal::Lexer#next_string_array_token,
    # which 1.21 removed). Move back to a version constraint once a release
    # carrying crystal-ameba/ameba#866 exists.
    commit: b50c1ffde626449c8fd32c1ae68813b2be2bb101
