name: Pages

on:
  push:
    branches:
      - master
    paths:
      - "site/**"
      # The recording the site plays and the installer it serves both live
      # outside site/ and are copied in at deploy time, so a change to either
      # still has to redeploy.
      - "docs/demo/obsctl.cast"
      - "install.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Only the deployment needs write access, and only to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer commit should win, but never by cancelling a deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy microsite
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # site/themes.js is exported from the real theme table by
      # scripts/render_site_themes.cr. It is committed so the deploy needs no
      # Crystal toolchain, but a stale copy would quietly ship colours that no
      # longer match the binary, so fail loudly instead.
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.21.0"

      - name: Install shards
        run: shards install --production

      - name: Check the exported themes are current
        run: |
          cp site/themes.js /tmp/themes.committed.js
          make site-themes
          if ! diff -q /tmp/themes.committed.js site/themes.js >/dev/null; then
            echo "::error::site/themes.js is stale. Run 'make site-themes' and commit the result." >&2
            diff /tmp/themes.committed.js site/themes.js | head -20 >&2
            exit 1
          fi

      # Both copied in at deploy time rather than kept as second copies in the
      # repo: `curl .../install.sh` can then never serve a script that has
      # drifted from the one in the tree, and the demo recording the README
      # links to is byte-for-byte the one the site plays.
      - name: Publish the installer alongside the site
        run: cp install.sh site/install.sh

      - name: Publish the demo recording alongside the site
        run: |
          mkdir -p site/demo
          cp docs/demo/obsctl.cast site/demo/obsctl.cast

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
