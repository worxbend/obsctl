name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (crystal ${{ matrix.crystal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.20.2 is the floor declared in shard.yml; latest catches upstream drift.
        #
        # Only the floor leg lints. Ameba analyses source, not the compiler, so
        # running it twice over the same tree adds nothing — and its released
        # version does not build on every future compiler, which would turn a
        # tooling incompatibility into a red build for code that is fine. The
        # latest leg answers the question it exists to answer: does obsctl still
        # compile and pass its specs on the newest Crystal.
        include:
          - crystal: "1.20.2"
            lint: true
            shards_flags: ""
          - crystal: latest
            lint: false
            shards_flags: "--production"
    env:
      CRYSTAL_CACHE_DIR: /tmp/obsctl-crystal-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Cache Crystal build artifacts
        uses: actions/cache@v4
        with:
          path: /tmp/obsctl-crystal-cache
          key: crystal-cache-${{ matrix.crystal }}-${{ hashFiles('shard.lock') }}-${{ github.sha }}
          restore-keys: |
            crystal-cache-${{ matrix.crystal }}-${{ hashFiles('shard.lock') }}-
            crystal-cache-${{ matrix.crystal }}-

      # The linting leg needs the development dependencies, because ameba's
      # postinstall is what produces bin/ameba. The other leg skips them so an
      # unbuildable dev dependency cannot fail the whole job before the build
      # and specs have run.
      - name: Install shards
        run: shards install ${{ matrix.shards_flags }}

      - name: Check formatting
        run: make format-check

      - name: Lint
        if: matrix.lint
        run: make lint

      - name: Build
        run: make build

      - name: Test
        run: make test
